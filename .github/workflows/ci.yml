name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    # Releases are cut from the commit messages on master, so a non-conventional message is a
    # release bug, not a style nit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Commit Messages
        run: |
          pnpm exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Nx needs history on both sides of the comparison to work out what changed.
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Derive SHAs for `nx affected`
        uses: nrwl/nx-set-shas@v4

      - name: Check Formatting
        run: pnpm exec nx format:check
        shell: bash

      - name: Lint, Test and Build Affected Projects
        run: pnpm exec nx affected -t lint test build --parallel=3
        shell: bash

      - name: Build Storybook
        run: pnpm exec nx build-storybook ui-storybook
        shell: bash
