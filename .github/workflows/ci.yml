name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    # Releases are cut from the commit messages on master, so a non-conventional message is a
    # release bug, not a style nit.
    #
    # Dependabot is exempt: its subject already follows the convention (see the commit-message
    # prefix in dependabot.yml), but its body lists every bump on its own line and those lines
    # run past config-conventional's 100-character body-max-line-length.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Commit Messages
        run: |
          pnpm exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    env:
      # Nx 24 keeps its cache and its graph database under a shared per-user root
      # (`~/.nx/<workspace-id>/{cache,databases}`) rather than in the checkout, so it can be reused
      # across worktrees. That is a good default locally and useless here: the id is a hash this
      # workflow cannot predict, and `actions/cache` can only address a path. Naming a cache
      # directory sends both of them back under `.nx/` in the workspace - setting any of the three
      # NX_*_DIRECTORY variables opts the whole shared layout out, cache and database together, so
      # neither can relocate without the other. Both paths are already gitignored.
      NX_CACHE_DIRECTORY: .nx/cache
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # Nx needs history on both sides of the comparison to work out what changed.
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Derive SHAs for `nx affected`
        uses: nrwl/nx-set-shas@v5
        with:
          # The release line is `master`; the action's own default is `main`. Left at the default it
          # looks for the last successful run of this workflow on a branch that does not exist here,
          # finds nothing, and falls back to the empty-tree SHA - which makes `nx affected` affect
          # every project, on every run.
          main-branch-name: master

      # Without a persisted task cache every run rebuilds all ~100 projects from
      # scratch. Keyed on the lockfile; the restore key lets any recent run seed it.
      #
      # Both directories, in one entry. Nx indexes its cached artifacts in the graph database under
      # `workspace-data`, so `cache` on its own is inert: restoring the artifacts without the
      # database that records them measures 0% hits, exactly as if nothing had been restored. One
      # entry rather than two also means they can only ever be restored as the matching pair they
      # were saved as.
      - name: Restore Nx Cache
        uses: actions/cache@v6
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check Formatting
        run: pnpm exec nx format:check
        shell: bash

      - name: Lint, Test and Build Affected Projects
        run: pnpm exec nx affected -t lint test build build-storybook --parallel=3
        shell: bash
