name: Publish

# Fallback publisher for a tag created outside the Release workflow - e.g. a local
# `pnpm release` followed by `git push --follow-tags`. The Release workflow publishes on its own;
# tags it pushes use GITHUB_TOKEN and therefore never trigger this workflow, so the two cannot
# publish the same version twice.
on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish, e.g. v2.0.0-alpha.9.'
        required: true
        type: string
      dryRun:
        description: 'Build and resolve everything without publishing.'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve and verify the version
        id: version
        env:
          # Through the environment rather than template interpolation, so the value can never be
          # parsed as shell.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          version=$(node -p "require('./libs/core/package.json').version")

          # Publishing a tag whose checkout carries a different version would push the wrong
          # artifacts to npm under a name nobody can trace back.
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match the workspace version $version."
            exit 1
          fi

          case "$version" in
            *-*) dist_tag='next' ;;
            *) dist_tag='latest' ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "distTag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version under the '$dist_tag' dist-tag."

      - name: Print environment info
        run: pnpm exec nx report

      - name: Authenticate with npm
        # Before the build, so a stale token costs seconds instead of a full workspace build. pnpm
        # reads credentials from .npmrc rather than NODE_AUTH_TOKEN, and npm reports an
        # unauthenticated publish as a 404 that looks like a missing package.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::The NPM_TOKEN secret is empty. Publishing needs a token with write access to the @xui scope."
            exit 1
          fi

          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"

          if ! whoami_output=$(npm whoami 2>&1); then
            echo "::error::npm rejected the token: ${whoami_output}"
            echo "::error::Create an automation token, or a granular token with read/write on the whole @xui scope, and update the NPM_TOKEN secret."
            exit 1
          fi

          echo "Authenticated with npm as ${whoami_output}."

      - name: Verify the workspace
        run: pnpm exec nx run-many -t lint test --parallel=3

      - name: Build packages
        run: pnpm exec nx run-many -t build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          DIST_TAG: ${{ steps.version.outputs.distTag }}
          INPUT_DRY_RUN: ${{ inputs.dryRun }}
        run: |
          set -euo pipefail

          dry_run_flag=''
          [ "${INPUT_DRY_RUN:-false}" = 'true' ] && dry_run_flag='--dry-run'

          pnpm exec nx release publish --tag "$DIST_TAG" $dry_run_flag

      - name: Summary
        if: always()
        run: |
          {
            echo "### Publish \`${{ steps.version.outputs.version }}\`"
            echo "- dist-tag: \`${{ steps.version.outputs.distTag }}\`"
            echo "- dry run: \`${{ inputs.dryRun == true }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
