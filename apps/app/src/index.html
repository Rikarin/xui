<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>xUI — Angular components, one package each</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="xUI is an Angular 22 component library styled with Tailwind CSS 4. Signal inputs, zoneless change detection, and a semantic token layer for light and dark."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Decided before first paint: a theme applied at bootstrap would flash the wrong one while the
      // bundle loads. The app reads this class back rather than deciding again.
      (function () {
        try {
          var stored = localStorage.getItem('xui-docs-theme');
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();

      // A theme built on /docs/theme-builder, re-applied before first paint for the same reason.
      // Stored as finished CSS so this stays short; the builder adopts the element by its id.
      (function () {
        try {
          var css = localStorage.getItem('xui-docs-theme-css');

          if (!css) {
            return;
          }

          var style = document.createElement('style');

          style.id = 'xui-docs-theme-overrides';
          style.textContent = css;
          document.head.appendChild(style);

          // These declarations only outrank theme.css's by coming after it, and the build inlines
          // the critical CSS below this script. Re-appending once the head is complete moves the
          // element back to the end.
          document.addEventListener('DOMContentLoaded', function () {
            document.head.appendChild(style);
          });
        } catch (error) {
          // No store, or a blocked one. The stock theme is a fine fallback.
        }
      })();
    </script>
  </head>
  <body>
    <a href="#main" class="skip-link">Skip to content</a>
    <app-root></app-root>
  </body>
</html>
