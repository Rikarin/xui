onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - core-js
  - esbuild
  - lmdb
  - msgpackr-extract
  - nx
  - unrs-resolver
  # Wrangler shells out to the workerd binary, which only exists after its install script runs.
  - workerd

overrides:
  # @nx/eslint-plugin and angular-eslint each pull their own @typescript-eslint
  # range, and the older ones reference the `FlatESLint` export ESLint 10
  # removed. Hold the packages that touch ESLint's API on one current line -
  # the version the root devDependencies declare, which this override shadows.
  '@typescript-eslint/eslint-plugin': ^8.72.1
  '@typescript-eslint/parser': ^8.72.1
  '@typescript-eslint/type-utils': ^8.72.1
  '@typescript-eslint/typescript-estree': ^8.72.1
  '@typescript-eslint/utils': ^8.72.1
